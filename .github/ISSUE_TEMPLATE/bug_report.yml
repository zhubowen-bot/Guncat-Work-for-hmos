name: Bug 报告
description: 报告一个可复现的问题（崩溃、显示异常、生成结果不对等）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！为了能快速定位，请尽量把下面的信息填全。
        如果是「API Key 无效 / 文件解析失败 / 流式中断」这类常见问题，先看一眼
        [常见问题](https://github.com/zhubowen-bot/Guncat-Work-for-hmos/blob/main/docs/guides/faq.md)，
        可能已经有答案。

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么？你期望发生什么？
      placeholder: |
        例如：交互模式下拖滑块，界面上的数字不跟着变，切走再切回来才更新。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 越具体越好，能稳定复现的问题才有机会被修
      placeholder: |
        1. 进入交互模式
        2. 输入「……」
        3. 拖动金额滑块
        4. 数字不变
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: 运行模式
      description: 问题出现在哪个模式？（应用启动默认落在交互模式）
      options:
        - 交互模式（Intelligent UI）
        - 工作模式（Agent Loop / Harness）
        - 聊天模式（通用 / 专家智能体）
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: protocol
    attributes:
      label: 接入协议
      options:
        - OpenAI Completions
        - OpenAI Responses
        - Anthropic Messages
        - 不确定 / 未配置

  - type: input
    id: model
    attributes:
      label: 使用的模型
      placeholder: 例如 DeepSeek V4.1 Flash / 火山方舟 doubao-seed-1-6

  - type: input
    id: app-version
    attributes:
      label: 应用版本
      description: 设置页可见，或看 README 顶部的版本徽章
      placeholder: 例如 6.3.0
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备与系统版本
      placeholder: 例如 Mate 60 Pro / HarmonyOS 6.0.0
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 截图 / 录屏 / 日志
      description: |
        显示类问题请附截图（拖进来即可）。若有「查看原始输出」或诊断面板里的内容，也请一并贴上。
      render: text

  - type: checkboxes
    id: self-check
    attributes:
      label: 提交前自查
      options:
        - label: 我已在最新版本上复现过（不是旧版本的问题）
        - label: 我已确认不是 API Key / 额度 / 网络问题
        - label: 我已搜索过现有 Issue，没有重复
          required: true
