name: CI

# 覆盖范围（边界是有意划定的，不是遗漏）
#
#   ✅ guncat-harness 纯逻辑单测 + 服务层 tsc 类型检查
#   ✅ docx / pptx / xlsx 三个 Office 生成器离线验证（Node 构建 + Python 结构校验）
#
#   ❌ 真实 ArkTS 编译 / HAP 构建：第三层验证需要 DevEco Studio + HarmonyOS SDK +
#      签名，GitHub 托管 runner 上无法提供。请在本地跑：
#          pwsh -File tools/build-check.ps1
#      它拦的是 ArkUI 只有编译器才知道的规则（@Builder 体内不能声明局部变量、
#      属性名不能与内置属性同名、@Prop 的 null 需要显式联合类型），
#      node 侧 harness 测不出来。详见 CONTRIBUTING.md「三层验证」。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic:
    name: 纯逻辑回归 + 类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 需要 Node >= 22.6 的原生 TS strip；Node 24 默认开启
      - name: 纯逻辑单测（setup + test-core）
        working-directory: test/guncat-harness
        run: |
          node setup.mjs
          node test-core.mjs

      - name: 服务层类型检查（check-setup + tsc）
        working-directory: test/guncat-harness
        run: |
          node check-setup.mjs
          npx -y -p typescript@5.5.4 tsc -p check/tsconfig.json

  office:
    name: Office 生成器离线验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Python 校验依赖
        run: python -m pip install --upgrade pip python-docx openpyxl python-pptx Pillow

      - name: Word 生成器
        working-directory: test/docx-harness
        run: |
          node setup.mjs
          node test-build.mjs
          python validate.py gen/out_all.docx
          python deep-check.py

      - name: Excel 生成器
        working-directory: test/xlsx-harness
        run: |
          node setup.mjs
          node test-build.mjs
          python validate.py gen/out_all.xlsx
          python deep-check.py

      - name: PowerPoint 生成器
        working-directory: test/pptx-harness
        run: |
          python makepng.py > png.b64
          node setup.mjs
          node test-build.mjs
          node test-transform.mjs
          node test-csv-glob.mjs
          node test-svg.mjs
          python validate.py gen/out_all.pptx gen/out_dark.pptx gen/out_outline.pptx gen/out_edit.pptx
          python deep-check.py

      - name: 展示生成的文档（失败时便于排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-output
          path: test/*/gen/*.docx
          if-no-files-found: ignore
          retention-days: 7
