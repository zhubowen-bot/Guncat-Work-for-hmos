name: CI

# 覆盖范围（边界是有意划定的，不是遗漏）
#
#   ✅ guncat-harness 纯逻辑单测 + 服务层 tsc 类型检查
#   ✅ 交互界面文字可复制护栏（源码级扫描，见 check-ui-copy.mjs）
#   ✅ 文档相对链接 + 随包第三方许可（docs-check / license-check）
#   ✅ docx / pptx / xlsx 三个 Office 生成器离线验证（Node 构建 + Python 结构校验）
#   ✅ py_runner 宿主侧协议测试（x86_64 Linux，不需要设备）
#   ✅ IEC 随包 .so 静态一致性（launcher 映射、blob、入口符号、NEEDED、源码新鲜度、HAP）
#
#   ❌ 真实 ArkTS 编译 / HAP 构建：第三层验证需要 DevEco Studio + HarmonyOS SDK +
#      签名，GitHub 托管 runner 上无法提供。请在本地跑：
#          pwsh -File tools/build-check.ps1
#      它拦的是 ArkUI 只有编译器才知道的规则（@Builder 体内不能声明局部变量、
#      属性名不能与内置属性同名、@Prop 的 null 需要显式联合类型），
#      node 侧 harness 测不出来。详见 CONTRIBUTING.md「三层验证」。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic:
    name: 纯逻辑回归 + 类型检查
    # 固定 runner 版本：ubuntu-latest 会随 GitHub 迁移镜像（官方已在提示迁移到 Ubuntu 26），
    # 固定版本可避免某天构建毫无征兆地变化
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # 新鲜度检查要读每个文件"最后一次改动它的提交"的时间（git log -1 -- <path>）。
          # 默认的浅克隆只有 HEAD，历史里没碰过该文件的路径会查不到时间，正常产物
          # 会被误报成"没有提交记录"。
          fetch-depth: 0

      # 纯 Python、秒级，且都是发布门槛：坏链会让文档指向不存在的文件，
      # 许可不同步会让 HAP 带旧声明/漏原文。放在最便宜的 job 里先失败。
      - name: 文档相对链接 + 随包许可
        run: |
          python3 tooling/docs-check.py --strict
          python3 tooling/license-check.py --strict

      # 不需要设备/SDK：解析 ETS 的 launcher 映射，校验随包 .so 的 blob 与
      # 工作区字节一致、入口符号、NEEDED 白名单，比较源码与产物的最后提交时间，
      # 并在本机存在 HAP 时检查 libs/arm64-v8a 是否缺库。llvm-nm 缺失时回退
      # GNU nm，两者都没有才 SKIP；映射/新鲜度/blob 检查始终执行。
      - name: IEC 随包 .so 一致性
        run: python3 tools/check-iec-libs.py

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # 需要 Node >= 22.6 的原生 TS strip；Node 24 默认开启
      - name: 纯逻辑单测（setup + test-core）
        working-directory: test/guncat-harness
        run: |
          node setup.mjs
          node test-core.mjs

      - name: 服务层类型检查（check-setup + tsc）
        working-directory: test/guncat-harness
        run: |
          node check-setup.mjs
          npx -y -p typescript@5.5.4 tsc -p check/tsconfig.json

      # 不需要 setup.mjs：这个脚本直接扫 entry/ 下的 .ets 源码，不移植也不编译。
      # 它守的是"交互界面里的内容文字都挂了 copyOption（长按自由复制）"，
      # 漏挂只表现为"那块字长按没反应"，编译和单测都拦不住。
      - name: 交互界面文字可复制护栏
        working-directory: test/guncat-harness
        run: node check-ui-copy.mjs

  py-runner:
    name: py_runner 宿主协议测试
    # 不需要设备：用宿主的 libpython 覆盖编译期路径，走本机 UDS 跑完整的
    # 退出码 / stdio 分离 / 二进制 / 并发 / SIGKILL / 大输出 / 错误路径断言。
    # 入口见 third_party/bettersh/scripts/test_py_runner_host.sh。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Ubuntu 24.04 自带 python3.12 运行时；-dev 包确保有可被 dlopen 的
      # libpython3.12.so（run.py 会优先找 3.12）。
      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ python3 libpython3.12-dev

      - name: 宿主侧 py_runner 协议测试
        run: bash third_party/bettersh/scripts/test_py_runner_host.sh

  office:
    name: Office 生成器离线验证
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装 Python 校验依赖
        run: python -m pip install --upgrade pip python-docx openpyxl python-pptx Pillow

      # gen/ 下的产物是被 git 跟踪的，checkout 出来就带着上一次提交的旧文件。
      # 先删掉待验证的产物，确保下面校验的一定是**本次构建**的结果，
      # 而不是"文件存在所以通过"。
      - name: 清掉已提交的旧产物
        run: |
          rm -f test/docx-harness/gen/out_*.docx
          rm -f test/xlsx-harness/gen/out_*.xlsx
          rm -f test/pptx-harness/gen/out_*.pptx

      - name: Word 生成器
        working-directory: test/docx-harness
        run: |
          python makepng.py > png.b64
          node setup.mjs
          node test-build.mjs
          test -f gen/out_all.docx || { echo "构建未产出 gen/out_all.docx"; exit 1; }
          python validate.py gen/out_all.docx
          python deep-check.py

      - name: Excel 生成器
        working-directory: test/xlsx-harness
        run: |
          node setup.mjs
          node test-build.mjs
          test -f gen/out_all.xlsx || { echo "构建未产出 gen/out_all.xlsx"; exit 1; }
          python validate.py gen/out_all.xlsx
          python deep-check.py

      - name: PowerPoint 生成器
        working-directory: test/pptx-harness
        run: |
          python makepng.py > png.b64
          node setup.mjs
          node test-build.mjs
          for f in gen/out_all.pptx gen/out_dark.pptx gen/out_outline.pptx gen/out_edit.pptx; do test -f "$f" || { echo "构建未产出 $f"; exit 1; }; done
          node test-transform.mjs
          node test-csv-glob.mjs
          node test-svg.mjs
          python validate.py gen/out_all.pptx gen/out_dark.pptx gen/out_outline.pptx gen/out_edit.pptx
          python deep-check.py

      - name: 失败时保留生成物以便排查
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: harness-output
          path: test/*/gen/out_*
          if-no-files-found: ignore
          retention-days: 7
